name: SEO pass
on:
  push:
    paths: ['.github/workflows/seo-pass.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SEO changes
        shell: python
        run: |
          import re, json, datetime
          from pathlib import Path
          B='https://ancorapyd.github.io'
          today=datetime.date.today().isoformat()
          def ld(o): return '<script type="application/ld+json">'+json.dumps(o,ensure_ascii=False,separators=(',',':'))+'</script>'
          def lit(old,new,s,n=1):
              assert s.count(old)==n,(old[:70],s.count(old)); return s.replace(old,new)
          for f in ['17-index.html','en/18-index.html','index.html19-index.html','index.html20-index.htm']:
              p=Path(f)
              if p.exists(): p.unlink()
          keep=[Path('index.html'),Path('en/index.html'),Path('404.html')]
          alltxt=''.join(p.read_text() for p in keep)
          for css in ['7-styles.css','9-ancora-styles-v2.css']:
              if Path(css).exists() and css not in alltxt: Path(css).unlink()
          T={'es':dict(f='index.html',old='Áncora | Cristal a medida desde 1980',new='Cristalería en Villacañas | Cristal a medida desde 1980 · Áncora',
             desc='Cristalería en Villacañas (Toledo): cristal a medida, espejos, mamparas, reparaciones y cristal templado e ignífugo. Comarca, Madrid y centro de España.',
             eb_old='Cristal a medida · Villacañas · Desde 1980',eb_new='Cristalería · Villacañas · Desde 1980',url=B+'/'),
             'en':dict(f='en/index.html',old='Áncora | Bespoke glass since 1980',new='Glass company in Villacañas | Bespoke glass since 1980 · Áncora',
             desc='Glass company in Villacañas (Toledo): bespoke glass, mirrors, shower screens, repairs, tempered and fire-rated glass. Serving Madrid and central Spain.',
             eb_old='Bespoke glass · Villacañas · Since 1980',eb_new='Glass company · Villacañas · Since 1980',url=B+'/en/')}
          for lang,t in T.items():
              p=Path(t['f']); s=p.read_text()
              s=lit('<title>%s</title>'%t['old'],'<title>%s</title>'%t['new'],s)
              s=lit('content="%s"'%t['old'],'content="%s"'%t['new'],s,s.count('content="%s"'%t['old']))
              d=re.search(r'<meta name="description" content="([^"]*)">',s).group(1)
              s=s.replace('content="%s"'%d,'content="%s"'%t['desc'])
              s=lit(t['eb_old'],t['eb_new'],s)
              if 'hreflang="x-default"' not in s:
                  s=lit('<link rel="alternate" hreflang="en" href="%s/en/">'%B,'<link rel="alternate" hreflang="en" href="%s/en/">\n<link rel="alternate" hreflang="x-default" href="%s/">'%(B,B),s)
              # click-to-call
              s=re.sub(r'<strong>643 554 180</strong>','<strong><a href="tel:+34643554180" style="color:inherit;text-decoration:none">643 554 180</a></strong>',s)
              # lazy gallery
              s=re.sub(r'(<div class="pane"><img )',r'\1loading="lazy" decoding="async" ',s)
              biz={"@context":"https://schema.org","@type":"HomeAndConstructionBusiness","@id":B+"/#business","name":"Proyectos y Desarrollos Áncora","alternateName":["Áncora","Cristalería Áncora"],
                "url":t['url'],"inLanguage":lang,"description":t['desc'],"telephone":"+34 643 554 180","email":"cristalesancora@gmail.com",
                "logo":B+"/assets/10-ancora-logo-transparent-v1.png","image":B+"/assets/31-ancora-social-v3-cristal-safe.png",
                "address":{"@type":"PostalAddress","addressLocality":"Villacañas","addressRegion":"Toledo","addressCountry":"ES"},
                "areaServed":["Villacañas","Toledo","Madrid","España"],
                "openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday"],"opens":"09:00","closes":"14:00"},
                                             {"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday"],"opens":"15:00","closes":"18:00"}],
                "knowsAbout":["Cristal a medida","Espejos","Mamparas","Cristal templado","Cristal ignífugo","Reparación de cristales"] if lang=='es' else ["Bespoke glass","Mirrors","Shower screens","Tempered glass","Fire-rated glass","Glass repairs"]}
              s=lit('</head>',ld(biz)+'</head>',s)
              p.write_text(s)
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>%s/</loc><lastmod>%s</lastmod></url>\n  <url><loc>%s/en/</loc><lastmod>%s</lastmod></url>\n</urlset>\n'%(B,today,B,today))
          Path('robots.txt').write_text('User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n'%B)
          print('ok')
          Path('.github/workflows/seo-pass.yml').unlink()
      - name: Commit
        run: |
          git config user.name 'RaulBaeza15'
          git config user.email '177480579+RaulBaeza15@users.noreply.github.com'
          git add -A
          git commit -m 'SEO: local business data, sitemap, robots, titles, remove stray duplicate pages'
          git push
